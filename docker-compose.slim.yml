# Set IMAGE_SOURCE=png-image-url and IMAGE_URL in .env before starting.
# Update: docker compose -f docker-compose.slim.yml pull && docker compose -f docker-compose.slim.yml up -d
# Build from this checkout instead: add --build to the up command.
services:
  web-frame:
    build:
      context: .
      target: slim
    image: ghcr.io/robinbakker/web-frame:slim
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 33636
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:33636:33636"
    volumes:
      - token-data:/app/data
      - ./output:/app/output
      - ./.env:/app/.env
    command: start
    restart: unless-stopped
    # On Linux, host networking can be used for TV discovery. Remove ports and
    # set SERVER_HOST=127.0.0.1 when enabling network_mode: host.
volumes:
  token-data:
