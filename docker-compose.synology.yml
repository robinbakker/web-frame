# docker-compose.synology.yml
# Synology NAS / Container Manager deployment
#
# SETUP (one-time, on the Synology):
#   1. Create a project folder on the NAS, e.g.:  /volume1/docker/web-frame/
#   2. Place this file in that folder as:          docker-compose.yml
#   3. Copy .env.example to .env in that folder and set TV_IP + CONTENT_URL.
#      Set a unique AUTH_PASS (at least 16 characters) and copy seccomp_profile.json too.
#      Create an output/ directory too. Ensure .env exists as a FILE before starting;
#      otherwise Docker may create a directory at that bind-mount path.
#   4. Container Manager → Project → Create → point to that folder → Done
#      The image is pulled from ghcr.io on first start.
#      The entrypoint fixes mount ownership/access on every container start.
#      The app runs as node, UID/GID 1000; only permission setup runs as root.
#      If EACCES persists, check inherited deny rules in File Station permissions.
#      Remove the old stopped permissions container once; it is no longer needed.
#
# UPDATE (over SSH): cd /volume1/docker/web-frame && sudo docker compose pull && sudo docker compose up -d

services:
  web-frame:
    image: ghcr.io/robinbakker/web-frame:latest
    # Root is used only for entrypoint permission setup; it then switches to node.
    user: "0:0"
    environment:
      SERVER_HOST: 127.0.0.1
      SERVER_PORT: 33636
    init: true
    # Only what the entrypoint needs to repair mount ownership and modes (CHOWN, DAC_OVERRIDE, FOWNER,
    # FSETID keeps setgid folders intact) and to switch to node (SETUID, SETGID), plus KILL so the
    # init process, which stays root, can pass Docker's stop signal on to the app. Switching user
    # clears them, and no-new-privileges keeps the app from getting them back, so the app itself
    # runs with no capabilities. Never mount the Docker socket into this container.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - SETUID
      - SETGID
      - KILL
    security_opt:
      - no-new-privileges:true
      # DSM reports "seccomp is not enabled in your kernel", temp disabled the next line.
      # If you enable it, also add SYS_CHROOT to cap_add: the profile only allows Chromium's
      # sandbox to chroot when the container has that capability (see docker-compose.yml).
      #- seccomp=./seccomp_profile.json
    read_only: true
    # In-memory scratch space, cleared on every restart. Playwright starts Chromium with
    # --disable-dev-shm-usage, so Chromium keeps its shared memory in /tmp (not /dev/shm, which is
    # why there is no shm_size), next to its temporary profile and caches. Raise the /tmp size
    # if very large CONTENT_/OUTPUT_ sizes make screenshots crash.
    tmpfs:
      - /tmp:size=1g
      - /home/node:size=64m

    volumes:
      # Persist the TV pairing token between container restarts
      - token-data:/app/data
      # Generated artwork — visible in the project folder on the NAS
      - ./output:/app/output
      # Read and save the same root .env used for local execution.
      - ./.env:/app/.env

    # Start the application and scheduler. Set SCHEDULE_INTERVAL in .env (e.g. 30m, 1h, 6h).
    command: start
    restart: unless-stopped

    # Synology runs Linux — host networking lets the container reach the TV on your LAN.
    network_mode: host

volumes:
  token-data:
