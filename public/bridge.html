<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; connect-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Web Frame</title>
    <style>
      :root {
        --bg: #1a1a1a;
        --surface: #fff;
        --fg: #f4f3f0;
        --muted: #a9a59c;
        --line: color-mix(in srgb, var(--surface) 15%, transparent);
        --accent: #003c96;
        --accent-h: #0251c7;
        --danger: #f08a8a;
        --ok: #5fd08a;
        --radius: 8px;
        --font: system-ui, -apple-system, sans-serif;
        --mono: ui-monospace, 'Cascadia Mono', Consolas, monospace;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font);
        font-size: 15px;
        line-height: 1.5;
      }
      main {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 1.25rem;
        max-width: 380px;
        margin: 0 auto;
        padding: 2rem 1.25rem;
      }
      .logo {
        width: 48px;
        height: 48px;
        filter: invert(1);
      }
      h1 {
        font-size: 1.4rem;
        font-weight: 600;
        line-height: 1.25;
      }
      p {
        color: var(--muted);
      }
      p strong {
        color: var(--fg);
        font-weight: 600;
      }
      section {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      [hidden] {
        display: none !important;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      label {
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--muted);
      }
      input {
        width: 100%;
        padding: 0.7rem 0.75rem;
        border: 2px solid transparent;
        border-radius: var(--radius);
        background: var(--surface);
        color: #1a1a1a;
        font: 0.95rem var(--mono);
      }
      input:focus {
        outline: none;
        border-color: var(--accent-h);
      }
      .error {
        min-height: 1.5em;
        color: var(--danger);
        font-size: 0.9rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0.6rem 1.25rem;
        border: 2px solid var(--line);
        border-radius: var(--radius);
        background: transparent;
        color: color-mix(in srgb, var(--surface) 80%, transparent);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
        transition:
          background-color 0.15s,
          color 0.15s;
      }
      .btn:hover {
        background: color-mix(in srgb, var(--surface) 12%, transparent);
        color: var(--surface);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: progress;
      }
      .btn-primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--accent-h);
        border-color: var(--accent-h);
      }
      .btn-row {
        display: flex;
        gap: 0.75rem;
      }
      .btn-row .btn {
        flex: 1;
      }
      .link {
        align-self: flex-start;
        background: none;
        border: none;
        color: var(--muted);
        font: inherit;
        font-size: 0.9rem;
        text-decoration: underline;
        text-underline-offset: 3px;
        cursor: pointer;
      }
      .link:hover {
        color: var(--fg);
      }
      .note,
      .warning {
        font-size: 0.9rem;
      }
      .warning {
        color: var(--danger);
      }
      .notice {
        padding: 0.6rem 0.75rem;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        color: var(--fg);
        font-size: 0.9rem;
      }
      .tvs {
        list-style: none;
        border-top: 1px solid var(--line);
      }
      .tvs li {
        display: flex;
        flex-direction: column;
        padding: 0.75rem 0;
        border-bottom: 1px solid var(--line);
      }
      .tv-name {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 600;
      }
      .tv-name::before {
        content: '';
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
      }
      .tv-ok .tv-name::before {
        background: var(--ok);
      }
      .tv-error .tv-name::before {
        background: var(--danger);
      }
      .tv-detail {
        color: var(--muted);
        font-size: 0.9rem;
      }
      .tv-ip {
        font-family: var(--mono);
        font-size: 0.85rem;
      }
      .footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--muted);
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="logo-icon.svg" alt="" />

      <section id="connect" hidden>
        <h1 id="connect-title">Connect to Frame This</h1>
        <p id="connect-intro">
          In Frame This, open <strong>TVs</strong> and choose <strong>Add bridge</strong>. Copy the connect code and
          paste it here.
        </p>
        <form id="connect-form" novalidate>
          <label for="code">Connect code</label>
          <input id="code" type="text" autocomplete="off" spellcheck="false" placeholder="ftd_…" />
          <p id="connect-error" class="error" role="alert"></p>
          <button id="connect-button" class="btn btn-primary" type="submit">Connect</button>
        </form>
        <p id="restart-note" class="note" hidden>
          Web Frame restarts to switch to Frame This. Your local settings stay as they are.
        </p>
        <button id="standalone" class="link" type="button" hidden>Use without Frame This</button>
      </section>

      <section id="status" hidden>
        <h1>Connected to Frame This</h1>
        <p id="status-line"></p>
        <p id="warning" class="warning" hidden></p>
        <ul id="tvs" class="tvs"></ul>
        <p id="no-tvs" hidden>In Frame This, choose a TV and a channel for this bridge.</p>
        <p id="notice" class="notice" hidden></p>
        <div class="btn-row">
          <button id="run-now" class="btn" type="button">Run now</button>
          <button id="open" class="btn btn-primary" type="button">Open Frame This</button>
        </div>
        <div class="footer">
          <span id="version"></span>
          <button id="unlink" class="link" type="button">Unlink this computer</button>
        </div>
      </section>
    </main>
    <script src="bridge.js"></script>
  </body>
</html>
