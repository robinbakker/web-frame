# Copy this file as docker-compose.yml into /volume1/docker/web-frame/.
# Keep existing .env, output/, and project/token volume; new installs copy
# .env.example to .env and create output/. Set TV_IP, AUTH_USER, a unique
# AUTH_PASS (16+ characters), IMAGE_SOURCE=png-image-url and an HTTPS IMAGE_URL.
# Create/start the project in Container Manager; it pulls the image from ghcr.io.
# No custom seccomp file needed.
# Update (over SSH): cd /volume1/docker/web-frame && sudo docker compose pull && sudo docker compose up -d
services:
  web-frame:
    image: ghcr.io/robinbakker/web-frame:slim
    # The entrypoint repairs mount permissions, then drops to UID/GID 1000.
    user: "0:0"
    environment:
      SERVER_HOST: 127.0.0.1
      SERVER_PORT: 33636
    init: true
    # Only what the entrypoint needs to repair mount ownership and modes (CHOWN, DAC_OVERRIDE, FOWNER,
    # FSETID keeps setgid folders intact) and to switch to node (SETUID, SETGID), plus KILL so the
    # init process, which stays root, can pass Docker's stop signal on to the app. Switching user
    # clears them, and no-new-privileges keeps the app from getting them back.
    # Never mount the Docker socket into this container.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - SETUID
      - SETGID
      - KILL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    volumes:
      - token-data:/app/data
      - ./output:/app/output
      - ./.env:/app/.env
    command: start
    restart: unless-stopped
    network_mode: host
volumes:
  token-data:
