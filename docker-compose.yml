# Update: docker compose pull && docker compose up -d
# Build from this checkout instead: docker compose up -d --build
services:
  web-frame:
    image: ghcr.io/robinbakker/web-frame:latest
    build: .
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 33636
    init: true
    # Unprivileged: the app runs as node with no capabilities, can't gain privileges, and has a
    # read-only filesystem outside the volumes below. Never mount the Docker socket into this container.
    # SYS_CHROOT is only kept because seccomp_profile.json allows the chroot call just when the
    # container has it, and Chromium's sandbox chroots inside its own user namespace. As node, the
    # app never holds it itself.
    cap_drop:
      - ALL
    cap_add:
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp_profile.json
    read_only: true
    # In-memory scratch space, cleared on every restart. Playwright starts Chromium with
    # --disable-dev-shm-usage, so Chromium keeps its shared memory in /tmp (not /dev/shm, which is
    # why there is no shm_size), next to its temporary profile and caches. Raise the /tmp size
    # if very large CONTENT_/OUTPUT_ sizes make screenshots crash.
    tmpfs:
      - /tmp:size=1g
      - /home/node:size=64m
    # When using command "start", expose the web server port to the host so you can access it in a browser.
    ports:
      - "127.0.0.1:33636:33636"

    volumes:
      # Persist the TV pairing token between restarts
      - token-data:/app/data
      # Save generated artwork to the host for inspection
      - ./output:/app/output
      # Read and save the same root .env used for local execution.
      - ./.env:/app/.env

    # Use "start" to run the application and scheduler.
    # Or use "scheduler" to only run the scheduler (no web server).
    # Set SCHEDULE_INTERVAL in .env (e.g. 30m, 1h, 6h).
    command: start
    restart: unless-stopped
    # Networking notes:
    #
    # Docker Desktop (macOS / Windows): the default bridge network already
    # reaches your local network — TV_IP works as-is, no changes needed.
    #
    # Linux Docker Engine (e.g. Synology NAS): uncomment the line below so the container shares
    # the host network and can reach the TV on your LAN.
    #
    # network_mode: host
    # When enabling host networking, also change SERVER_HOST above to 127.0.0.1.

volumes:
  token-data:
