# Push a tag matching package.json, e.g. `git tag v1.0.0 && git push origin v1.0.0`, to publish:
# - ghcr.io/robinbakker/web-frame:<version> and :latest (Playwright image)
# - ghcr.io/robinbakker/web-frame:<version>-slim and :slim (browser-free image)
# - a draft GitHub Release with the Windows installer and the latest.yml feed used by auto-update
#
# Hardening (repository setup in docs/releasing.md):
# - The publishing jobs run in the `release` environment, which waits for a reviewer and only
#   accepts v* tags.
# - Images are signed with cosign (keyless) and get a provenance attestation, as does the installer.
# - The GitHub Release stays a draft until the maintainer signs the installer with an offline key
#   (npm run release:sign). The app only installs updates that carry that signature.
# - Actions are pinned by commit SHA; Dependabot proposes updates as pull requests.
# - Nothing restores the Actions cache: a release must not build from files that another workflow
#   run could have written.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test

  docker:
    needs: check
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signature and provenance attestation
      attestations: write
    strategy:
      matrix:
        include:
          - target: playwright
            tags: |
              ghcr.io/robinbakker/web-frame:${{ needs.check.outputs.version }}
              ghcr.io/robinbakker/web-frame:latest
          - target: slim
            tags: |
              ghcr.io/robinbakker/web-frame:${{ needs.check.outputs.version }}-slim
              ghcr.io/robinbakker/web-frame:slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # arm64 runtime stages run under emulation (NAS and Raspberry Pi hosts).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ matrix.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.licenses=MIT
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # Signs the multi-arch index by digest, which covers every tag that points at it.
      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/robinbakker/web-frame@${DIGEST}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/robinbakker/web-frame
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  desktop:
    needs: check
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
      id-token: write # provenance attestation
      attestations: write
    defaults:
      run:
        shell: bash
    # The GitHub token is only passed to the steps that publish, never to npm install scripts.
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      # Apps only install updates signed with the offline key that matches this public key, so an
      # installer built without it could never update itself again.
      - name: Check the update key is built in
        run: node --input-type=module -e "import { loadUpdatePublicKey } from './dist/electron/update-signature.js'; loadUpdatePublicKey();"
      # Created up front: left to electron-builder, its parallel uploads can each create a release
      # for the same tag (v1.0.0 ended up split in two, with the blockmap orphaned).
      - run: gh release create "$GITHUB_REF_NAME" --draft --title "$VERSION" --notes "" --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Uploads the installer, blockmap and latest.yml to the draft above.
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-app/Web-Frame-Setup-*.exe
      # The release stays a draft, which update checks can't see. The maintainer signs the installer
      # offline and publishes the release with `npm run release:sign` (docs/releasing.md).
